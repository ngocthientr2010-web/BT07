<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta content="width=device-width, initial-scale=1.0"
          name="viewport">

    <title>Cửa hàng</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

</head>

<body>

<!-- ================= HEADER ================= -->

<div th:replace="~{header :: header}"></div>


<!-- ================= MAIN ================= -->

<main class="container py-5">

    <!-- Tiêu đề -->
    <div class="text-center mb-5">

        <h1 class="fw-bold">
            Sản phẩm
        </h1>

        <p class="text-muted">
            Danh sách sản phẩm của cửa hàng
        </p>

    </div>


    <!-- Loading -->

    <div class="text-center py-5"
         id="loading">

        <div class="spinner-border"
             role="status">

            <span class="visually-hidden">
                Loading...
            </span>

        </div>

        <p class="mt-2">
            Đang tải sản phẩm...
        </p>

    </div>


    <!-- Error -->

    <div class="alert alert-danger d-none"
         id="errorMessage">

    </div>


    <!-- Product list -->

    <div class="row g-4"
         id="productList">

    </div>


    <!-- Không có sản phẩm -->

    <div class="text-center py-5 d-none"
         id="emptyMessage">

        <h4>
            Không có sản phẩm
        </h4>

        <p class="text-muted">
            Hiện tại cửa hàng chưa có sản phẩm nào.
        </p>

    </div>

</main>


<!-- ================= FOOTER ================= -->

<div th:replace="~{footer :: footer}"></div>


<!-- Bootstrap JS -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- ================= AJAX ================= -->

<script th:inline="javascript">

    /*
     * URL của API được Thymeleaf tạo ra.
     *
     * Ví dụ:
     *
     * http://localhost:8099/api/product
     *
     */
    const productApiUrl = /*[[@{/api/product}]]*/ "/api/product";


    /*
     * Khi trang HTML được load
     * gọi API lấy danh sách Product
     */
    $(document).ready(function () {

        loadProducts();

    });


    /*
     * Gọi API Product
     */
    function loadProducts() {

        $.ajax({

            url: productApiUrl,

            type: "GET",

            success: function (response) {

                console.log("API response:", response);

                /*
                 * API của bạn trả về:
                 *
                 * new Response(
                 *      true,
                 *      "Thành công",
                 *      productService.findAll()
                 * )
                 *
                 * Vì vậy dữ liệu Product nằm trong response.data
                 */
                const products = response.data;

                $("#loading").addClass("d-none");


                if (!products || products.length === 0) {

                    $("#emptyMessage")
                        .removeClass("d-none");

                    return;
                }


                renderProducts(products);

            },

            error: function (xhr) {

                console.error(xhr);

                $("#loading").addClass("d-none");

                $("#errorMessage")
                    .removeClass("d-none")
                    .text(
                        "Không thể tải danh sách sản phẩm."
                    );

            }

        });

    }


    /*
     * Render Product lên giao diện
     */
    function renderProducts(products) {

        let html = "";


        products.forEach(function (product) {

            /*
             * Tính giá sau giảm
             */
            const finalPrice =
                product.unitPrice -
                (product.unitPrice * product.discount / 100);


            /*
             * Xử lý trạng thái
             */
            let statusHtml = "";

            if (product.status === 1) {

                statusHtml =
                    `<span class="badge text-bg-success">
                        Đang bán
                     </span>`;

            } else {

                statusHtml =
                    `<span class="badge text-bg-secondary">
                        Ngừng bán
                     </span>`;

            }


            /*
             * Tạo card Product
             */
            html += `

                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                    <div class="card h-100 shadow-sm">

                        <!-- Image -->

                        <div class="text-center p-3">

                            ${
                product.images
                    ?
                    `
                                <img
                                    src="/uploads/${product.images}"
                                    class="card-img-top"
                                    style="
                                        height: 220px;
                                        object-fit: contain;
                                    "
                                    alt="${product.productName}"
                                >
                                `
                    :
                    `
                                <div
                                    class="d-flex
                                           justify-content-center
                                           align-items-center"
                                    style="
                                        height: 220px;
                                        background: #f5f5f5;
                                    "
                                >
                                    <span class="text-muted">
                                        Không có hình ảnh
                                    </span>
                                </div>
                                `
            }

                        </div>


                        <!-- Product information -->

                        <div class="card-body">

                            <h5 class="card-title">

                                ${product.productName}

                            </h5>


                            <p class="card-text text-muted">

                                ${product.description || ""}

                            </p>


                            <!-- Price -->

                            <div class="mb-2">

                                ${
                product.discount > 0
                    ?
                    `
                                    <span
                                        class="text-muted text-decoration-line-through">

                                        ${formatPrice(product.unitPrice)}

                                    </span>

                                    <br>

                                    <span
                                        class="fw-bold text-danger fs-5">

                                        ${formatPrice(finalPrice)}

                                    </span>

                                    <span
                                        class="badge text-bg-danger ms-1">

                                        -${product.discount}%

                                    </span>
                                    `
                    :
                    `
                                    <span
                                        class="fw-bold fs-5">

                                        ${formatPrice(product.unitPrice)}

                                    </span>
                                    `
            }

                            </div>


                            <!-- Quantity -->

                            <p class="mb-2">

                                <strong>
                                    Số lượng:
                                </strong>

                                ${product.quantity}

                            </p>


                            <!-- Status -->

                            ${statusHtml}

                        </div>


                        <!-- Footer -->

                        <div class="card-footer bg-white border-0">

                            <button
                                type="button"
                                class="btn btn-primary w-100"
                                onclick="viewProduct(${product.productId})">

                                Xem chi tiết

                            </button>

                        </div>

                    </div>

                </div>

            `;

        });


        /*
         * Đưa HTML vào productList
         */
        $("#productList").html(html);

    }


    /*
     * Format tiền
     *
     * Ví dụ:
     *
     * 100000
     *
     * =>
     *
     * 100.000 ₫
     */
    function formatPrice(price) {

        return new Intl.NumberFormat(
            "vi-VN",
            {
                style: "currency",
                currency: "VND"
            }
        ).format(price);

    }


    /*
     * Xem chi tiết Product
     */
    function viewProduct(productId) {

        window.location.href =
            "/product/" + productId;

    }

</script>

</body>

</html>
